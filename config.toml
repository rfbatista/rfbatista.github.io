baseurl = "https://rfbatista.github.io/"
title = "rfbatista"
pygmentsUseClasses=true
pygmentsCodeFences=true

# ---------------------------------------------------------------------------
# Multilíngue: PT-BR é o padrão e fica na raiz (URLs antigas preservadas);
# inglês fica em /en/. Traduções usam sufixo de idioma no nome do arquivo:
#   content/about/index.md      -> /about/
#   content/about/index.en.md   -> /en/about/
# Um post sem index.en.md simplesmente não aparece em /en/.
# ---------------------------------------------------------------------------
defaultContentLanguage = "pt-br"
defaultContentLanguageInSubdir = false

[services]
  [services.googleAnalytics]
    ID = 'G-T41ZMHMLD4'

# "cuidada em" (last tended) on garden notes comes from the last git commit
# that touched the file.
enableGitInfo = true

[frontmatter]
  lastmod = ["lastmod", ":git", "date"]

[params]
  author = "renan donato"

  [[params.footerlinks]]
  name = "e-mail"
  url = "mailto:contato@renandonato.com.br"

  [[params.footerlinks]]
  name = "github"
  url = "https://github.com/rfbatista"

[languages]
  [languages.pt-br]
    languageName = "Português"
    languageCode = "pt-br"
    weight = 1
    title = "rfbatista"
    [languages.pt-br.params]
      description = "Sou o Renan Donato, engenheiro de software no Brasil. Escrevo sobre sistemas, Go e inferência de LLMs."

      [[languages.pt-br.params.navlinks]]
      name = "escritos"
      url = "posts/"
      section = "posts"

      [[languages.pt-br.params.navlinks]]
      name = "jardim"
      url = "jardim/"
      section = "jardim"

      [[languages.pt-br.params.navlinks]]
      name = "sobre"
      url = "about/"
      section = "about"

      # Coleções antigas, acessíveis pelo rodapé e pelo jardim
      [[languages.pt-br.params.archivelinks]]
      name = "livros"
      url = "books/"

      [[languages.pt-br.params.archivelinks]]
      name = "listas"
      url = "lists/"

      [[languages.pt-br.params.archivelinks]]
      name = "fotos"
      url = "photos/"

  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 2
    title = "rfbatista"
    [languages.en.params]
      description = "I'm Renan Donato, a software engineer in Brazil. I write about systems, Go, and LLM inference."

      [[languages.en.params.navlinks]]
      name = "writing"
      url = "posts/"
      section = "posts"

      # The garden is Portuguese-only: link to the root-language section.
      [[languages.en.params.navlinks]]
      name = "garden"
      url = "jardim/"
      section = "jardim"
      absolute = true

      [[languages.en.params.navlinks]]
      name = "about"
      url = "about/"
      section = "about"

      [[languages.en.params.archivelinks]]
      name = "books"
      url = "books/"

      [[languages.en.params.archivelinks]]
      name = "lists"
      url = "lists/"

      [[languages.en.params.archivelinks]]
      name = "photos"
      url = "photos/"

[taxonomies]
   tag = "tags"
   category = "categories"
