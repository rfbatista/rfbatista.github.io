<div class="site-footer">
  <div>
    <strong>Arquivo</strong>
    {{ range .Site.Params.archivelinks }}<a href="{{ absLangURL .url }}">{{ .name }}</a> {{ end }}
  </div>
  <div>
    <strong>{{ i18n "switchLanguageFooter" }}</strong>
    {{ range partial "language-links.html" . }}<a href="{{ .url }}" hreflang="{{ .lang }}">{{ .name }}</a> {{ end }}
  </div>
</div>
