<footer class="site">
  <span>
    {{- range $i, $l := .Site.Params.footerlinks }}{{ if $i }} · {{ end }}<a href="{{ $l.url }}"{{ if hasPrefix $l.url "http" }} class="ext"{{ end }}>{{ $l.name }}</a>{{ end }}
    · <a href="{{ with .Site.Home.OutputFormats.Get "RSS" }}{{ .Permalink }}{{ end }}">rss</a>
    · <a href="{{ absURL "photos/" }}">{{ i18n "photos" }}</a>
  </span>
</footer>
