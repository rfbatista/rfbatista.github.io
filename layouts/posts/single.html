{{ define "main" }}
<h1 class="article-title">{{ .Title }}</h1>
<p class="article-byline">
  <b>{{ .Site.Title }}</b> &mdash; {{ .Date.Format (i18n "dateFormatLong") }} &middot; {{ .ReadingTime }} {{ i18n "readingTime" }}
</p>

{{ with .Description }}
<div class="abstract-box"><p>{{ . }}</p></div>
{{ end }}

{{ with .Params.tags }}
<p class="tags">{{ delimit . " · " }}</p>
{{ end }}

<div class="article-body">
  {{ .Content }}
</div>
{{ end }}
