# Project list: every Project the blog shows, in both languages (ADR 0001).
# One entry per Project; the Projects page and the home page both read this file.
#
#   name      display name
#   url       link target; leave out for a private project with nothing to link
#   year      year started; Projects without one sort last in their group
#   stack     main language/stack (optional)
#   active    true = Active project (amber label), false = Earlier project
#   featured  true = also shown on the home page (optional)
#   desc      one line per language; markdown, so a word can link to a post
#   status    short label per language, free text
#
# Within a group the order is year, newest first; ties keep the order below.
# The home page shows the featured Projects in the order below.

